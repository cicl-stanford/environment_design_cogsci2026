<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Design this kitchen!</title>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="./assets/favicon.ico" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />

    <!-- Core dependencies -->
    <script src="https://unpkg.com/lodash@4.17.21"></script>
    <script src="https://unpkg.com/jspsych@8.2.1"></script>

    <!-- jsPsych plugins (official) -->
    <script src="https://unpkg.com/@jspsych/plugin-preload@2.1.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-browser-check@2.1.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-instructions@2.1.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-button-response@2.1.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey-multi-choice@2.1.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey@2.1.0"></script>

    <!-- Datapipe -->
    <script src="https://unpkg.com/@jspsych-contrib/plugin-pipe"></script>

    <!-- Custom overcooked plugins from unpkg (all plugins with bundled dependencies) -->
    <script src="https://unpkg.com/jspsych-overcooked"></script>

    <!-- Stylesheets -->
    <link
      href="https://unpkg.com/jspsych@8.2.1/css/jspsych.css"
      rel="stylesheet"
      type="text/css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/@jspsych/plugin-survey@2.1.0/css/survey.css"
    />

    <!-- Module imports -->
    <script type="module" src="./js/setup.js"></script>
    <script type="module" src="./config.mjs"></script>
  </head>
  <style>
    img {
      -webkit-user-drag: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }
  </style>
  <body></body>
  <script type="module">
    import { setupExperiment } from "./js/setup.js";
    import { settings } from "./config.mjs";

    if (!settings.study_metadata.dev_mode) {
      document.addEventListener("contextmenu", (event) =>
        event.preventDefault()
      );
      window.onbeforeunload = () => {
        return "Please do not refresh the page or go back, changes you made may not be saved!";
      };
    }
    setupExperiment();
  </script>
</html>
